name: Auto merge claude branches to main

on:
  push:
    branches:
      - 'claude/**'
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge all claude/* branches to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main

          # pushトリガーの場合は該当ブランチのみ、手動の場合は全claude/*をマージ
          if [ "${{ github.event_name }}" = "push" ]; then
            BRANCHES="${{ github.ref_name }}"
          else
            BRANCHES=$(git branch -r | grep 'origin/claude/' | sed 's|origin/||')
          fi

          for branch in $BRANCHES; do
            echo "Merging $branch..."
            git merge "origin/$branch" --no-ff -m "Auto merge $branch" || echo "Conflict or already merged: $branch"
          done

          git push origin main
